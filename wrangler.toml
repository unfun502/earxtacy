name = "earxtacy"
main = "worker.js"
compatibility_date = "2024-09-25"
workers_dev = false

# Workers Static Assets (not legacy Workers Sites): asset reads aren't KV
# operations, so scanner traffic doesn't burn the KV quota. Every request runs
# through the worker so it can add security/cache headers and inject Umami.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
UMAMI_SITE_ID = "42883f3f-8594-46e6-9c46-f24da51c060e"

[env.production]
routes = [
  { pattern = "earxtacy.devlab502.net", custom_domain = true }
]

[env.production.vars]
UMAMI_SITE_ID = "42883f3f-8594-46e6-9c46-f24da51c060e"
